# Pilot: 1 text + 1 image prompt x seed 1 x both E1 conditions = 4 runs (Phase C step 1).
name: pilot
prompts: [t01, i01]
seeds: [1]
models: {builder: claude-haiku-5-5, critic: claude-opus-5-5, judge: null}
effort: high
render: l2
size: [256, 256]
compare_both_orders: true
budget: {max_steps: 40, max_cost_usd: 1.00, max_seconds: 900}
conditions:
  critic_on: {critic: true, rounds: 3, use_spec: true}
  critic_off: {critic: false, use_spec: true, budget: {max_cost_usd: 0.25}}
